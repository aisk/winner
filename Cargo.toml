[package]
name = "winner"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.22"
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.11"
oci-client = { version = "0.18.0", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tar = { version = "0.4.46", default-features = false }
tokio = { version = "1.54.1", default-features = false, features = ["fs", "rt"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_HostComputeSystem", "Win32_System_HostComputeNetwork", "Win32_System_Com", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_SystemInformation", "Win32_Security", "Wdk_System_SystemServices"] }
windows-link = "0.2"
